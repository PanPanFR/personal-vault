name: contract

on:
  push:
    paths:
      - "src/lib/**"
      - "src/db/**"
      - "migrations/**"
      - "openapi.yaml"
      - "scripts/check-contract-drift.mjs"
  pull_request:
    paths:
      - "src/lib/**"
      - "src/db/**"
      - "migrations/**"
      - "openapi.yaml"
      - "scripts/check-contract-drift.mjs"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract-drift
