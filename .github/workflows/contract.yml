name: contract

on:
  push:
    paths:
      - "src/lib/**"
      - "src/db/**"
      - "migrations/**"
      - "openapi.yaml"
      - "scripts/check-contract-drift.mjs"
  pull_request:
    paths:
      - "src/lib/**"
      - "src/db/**"
      - "migrations/**"
      - "openapi.yaml"
      - "scripts/check-contract-drift.mjs"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The lockfile IS the pin: a drifted lock is a hard failure, never a silent update.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run contract-drift
