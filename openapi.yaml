openapi: 3.1.0
info:
  title: Personal Vault API
  version: "1.0.0"
  description: >
    Machine-readable mirror of docs/backend/api-spec.md (normative human contract).
    Frozen contract v1: schema_version=1, crypto_format_version=1, kdf_version=1,
    key_version=1. Ciphertext-only storage. Adding/renaming fields or error codes
    requires a formal contract revision. Precedence: PRD > api-spec.md > openapi.yaml > code.
servers:
  - url: https://personal-vault.pages.dev/api/v1
    description: Production (pages.dev first, custom domain later)
  - url: /api/v1
    description: Same-origin (Cloudflare Pages Functions, Workers runtime)
security: []
paths:
  /vaults:
    post:
      summary: Create vault and register first device
      operationId: createVault
      description: >
        Unauthenticated. Rate limit 3/IP/hour. Creates vault with master +
        recovery envelopes and registers creating device.
        Caps: single ciphertext 384 KiB enforced server-side.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultCreateRequest'
      responses:
        '201':
          description: Vault created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultCreateResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /vaults/{vaultId}/bootstrap:
    get:
      summary: Fetch bootstrap metadata (master envelope only)
      operationId: getBootstrap
      description: >
        Authenticated read. Requires device bearer token. Returns master envelope
        + versions + change_cursor. MUST NEVER include recovery_envelope,
        recovery_auth_verifier, or device list.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vaultId
          required: true
          schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: 26-char ULID vault identifier
      responses:
        '200':
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /sync:
    get:
      summary: Fetch remote changes page by cursor
      operationId: getSyncChanges
      description: >
        Authenticated read. 300/vault/hour. Cursor is int >= 0 from
        sync_changes.seq. Tombstones returned with is_tombstone=true,
        ciphertext=null, nonce_b64u=null.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Ordered changes page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPageResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/SyncCursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/QuotaExhausted'
  /sync/batch:
    post:
      summary: Submit encrypted mutations (atomic CAS batch)
      operationId: postSyncBatch
      description: >
        Signed mutate. Requires bearer token + PV-Device Ed25519 signature.
        120/vault/hour. Max 50 mutations AND max 1 MiB body. Each ciphertext
        max 384 KiB. Atomic: any CAS failure rolls back whole batch with 409.
      security:
        - bearerAuth: []
          pvDevice: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Batch applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSigned'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/QuotaExhausted'
  /pairing-tickets:
    post:
      summary: Create single-use pairing ticket (5-min TTL)
      operationId: createPairingTicket
      description: >
        Signed. 5/device/hour. Single-active-ticket invariant: creating a new
        ticket supersedes any prior unconsumed ticket for the vault.
        Request carries ticket_hash = SHA-256(ticket) only.
      security:
        - bearerAuth: []
          pvDevice: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_hash]
              properties:
                ticket_hash:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: SHA-256 hex of 256-bit ticket secret
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                required: [ticket_id, expires_at]
                properties:
                  ticket_id:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSigned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /pairing/exchange:
    post:
      summary: Exchange ticket for device registration
      operationId: exchangePairingTicket
      description: >
        Unauthenticated (authorized by ticket knowledge). 10/vault/hour.
        Atomic single-use: hash match + expiry + unconsumed checked and consumed
        in one transaction. Server generates 256-bit device token, stores only
        SHA-256 hash, returns raw token once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingExchangeRequest'
      responses:
        '201':
          description: Device enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingExchangeResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/TicketInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
  /devices/{deviceId}/revoke:
    post:
      summary: Revoke authorized device
      operationId: revokeDevice
      description: >
        Signed. Idempotent: revoking an already-revoked device returns 200.
        Revoked devices get 401 DEVICE_REVOKED on all endpoints thereafter.
      security:
        - bearerAuth: []
          pvDevice: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [device_id, revoked_at, status]
                properties:
                  device_id:
                    type: string
                    format: uuid
                  revoked_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [revoked]
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSigned'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vault/crypto-metadata:
    put:
      summary: Update master/recovery envelopes
      operationId: updateCryptoMetadata
      description: >
        Signed. 10/vault/hour. Passphrase change touches master_envelope only
        (recovery untouched — same DEK under independent secret). Recovery
        rotation touches recovery_envelope + verifier.
      security:
        - bearerAuth: []
          pvDevice: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoMetadataUpdateRequest'
      responses:
        '200':
          description: Envelopes updated
          content:
            application/json:
              schema:
                type: object
                required: [vault_id, crypto_format_version, key_version, updated_at]
                properties:
                  vault_id:
                    type: string
                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                  crypto_format_version:
                    type: integer
                  key_version:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedSigned'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
  /recovery/enroll-device:
    post:
      summary: Enroll new device via recovery authorization
      operationId: recoveryEnrollDevice
      description: >
        Recovery-authorized. 5/vault/hour with doubling backoff after 3 failures.
        Client sends only recovery_auth_token = HKDF(recovery_secret,
        PV-V1/RECOVERY-AUTH); raw secret and wrap key never leave device.
        201 returns device_token once PLUS recovery_envelope so the clean device
        can unwrap DEK without a second bootstrap round-trip.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEnrollRequest'
      responses:
        '201':
          description: Recovery enrollment (token + recovery envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryEnrollResponse'
          headers:
            X-Server-Time:
              $ref: '#/components/headers/X-Server-Time'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 256-bit device bearer token, base64url 43 chars, sent as Authorization Bearer
    pvDevice:
      type: apiKey
      in: header
      name: PV-Device
      description: >
        Ed25519 proof. Format device_id="<uuid>", timestamp="<ISO-8601>",
        nonce="<uuid>", signature="<base64url>". Signs METHOD path timestamp
        nonce body-SHA256. Required on all mutating endpoints.
  headers:
    X-Server-Time:
      description: Server ISO-8601 UTC time for clock-skew correction
      schema:
        type: string
        format: date-time
    Retry-After:
      description: Seconds until rate-limit window resets
      schema:
        type: integer
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - CRYPTO_VERSION_UNSUPPORTED
            - TICKET_INVALID
            - SYNC_CURSOR_INVALID
            - DEVICE_UNAUTHORIZED
            - DEVICE_REVOKED
            - INVALID_SIGNATURE
            - STALE_TIMESTAMP
            - VAULT_NOT_FOUND
            - REPLAY_DETECTED
            - REVISION_CONFLICT
            - VERSION_MISMATCH
            - TICKET_EXPIRED
            - TICKET_CONSUMED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - QUOTA_EXHAUSTED
        message:
          type: string
          description: Human-readable, no stack traces or secrets
        retryable:
          type: boolean
    MasterEnvelope:
      type: object
      required: [crypto_format_version, key_version, kdf_version, argon2_m_kib, argon2_t, argon2_p, salt_b64u, nonce_b64u, wrapped_dek_b64u]
      properties:
        crypto_format_version:
          type: integer
          enum: [1]
        key_version:
          type: integer
          minimum: 1
        kdf_version:
          type: integer
          enum: [1]
        argon2_m_kib:
          type: integer
          minimum: 65536
          maximum: 524288
          description: Floor 64 MiB, recommended 128 MiB, cap 512 MiB
        argon2_t:
          type: integer
          minimum: 3
          maximum: 5
        argon2_p:
          type: integer
          minimum: 1
          maximum: 4
        salt_b64u:
          type: string
          description: 16 random bytes base64url no padding (22 chars)
        nonce_b64u:
          type: string
          description: 24 random bytes base64url no padding (32 chars)
        wrapped_dek_b64u:
          type: string
          description: 48 raw bytes (32 DEK + 16 MAC) base64url (64 chars)
    RecoveryEnvelope:
      type: object
      required: [crypto_format_version, key_version, nonce_b64u, wrapped_dek_b64u]
      properties:
        crypto_format_version:
          type: integer
          enum: [1]
        key_version:
          type: integer
          minimum: 1
        nonce_b64u:
          type: string
        wrapped_dek_b64u:
          type: string
    DeviceRegister:
      type: object
      required: [device_id, device_token_hash, device_public_key]
      properties:
        device_id:
          type: string
          format: uuid
        device_token_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hex of raw bearer token
        device_public_key:
          type: string
          description: Ed25519 pubkey 32 bytes base64url
        label:
          type: string
          description: Device label, auto Device-XXXX renameable
    VaultCreateRequest:
      type: object
      required: [vault_id, crypto_format_version, key_version, schema_version, master_envelope, recovery_envelope, recovery_auth_verifier, device]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        crypto_format_version:
          type: integer
          enum: [1]
        key_version:
          type: integer
          enum: [1]
        schema_version:
          type: integer
          enum: [1]
        master_envelope:
          $ref: '#/components/schemas/MasterEnvelope'
        recovery_envelope:
          $ref: '#/components/schemas/RecoveryEnvelope'
        recovery_auth_verifier:
          type: string
          description: SHA-256 of HKDF recovery auth token
        device:
          $ref: '#/components/schemas/DeviceRegister'
    VaultCreateResponse:
      type: object
      required: [vault_id, device_id, created_at]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        device_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    BootstrapResponse:
      type: object
      required: [vault_id, crypto_format_version, key_version, kdf_version, schema_version, master_envelope, change_cursor]
      description: NEVER includes recovery_envelope, verifier, or device list
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        crypto_format_version:
          type: integer
        key_version:
          type: integer
        kdf_version:
          type: integer
        schema_version:
          type: integer
        master_envelope:
          $ref: '#/components/schemas/MasterEnvelope'
        change_cursor:
          type: integer
          minimum: 0
    SyncChange:
      type: object
      required: [change_seq, record_id, revision, schema_version, key_version, is_tombstone, updated_at]
      properties:
        change_seq:
          type: integer
          minimum: 0
        record_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        schema_version:
          type: integer
        key_version:
          type: integer
        is_tombstone:
          type: boolean
        ciphertext:
          type: [string, "null"]
          maxLength: 393216
          description: Base64url, max 384 KiB, null for tombstones
        nonce_b64u:
          type: [string, "null"]
        updated_at:
          type: string
          format: date-time
    SyncPageResponse:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor:
          type: integer
        has_more:
          type: boolean
    Mutation:
      type: object
      required: [mutation_id, record_id, expected_revision, schema_version, key_version, is_tombstone]
      properties:
        mutation_id:
          type: string
          format: uuid
          description: Client idempotency key
        record_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 0
          description: 0 for creates, CAS base for updates/deletes
        schema_version:
          type: integer
        key_version:
          type: integer
        is_tombstone:
          type: boolean
        ciphertext:
          type: [string, "null"]
          maxLength: 393216
        nonce_b64u:
          type: [string, "null"]
    SyncBatchRequest:
      type: object
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 50
          description: Max 50 mutations AND max 1 MiB body
          items:
            $ref: '#/components/schemas/Mutation'
    SyncBatchResult:
      type: object
      required: [mutation_id, record_id, revision, change_seq, status]
      properties:
        mutation_id:
          type: string
          format: uuid
        record_id:
          type: string
          format: uuid
        revision:
          type: integer
        change_seq:
          type: integer
        status:
          type: string
          enum: [applied]
    SyncBatchResponse:
      type: object
      required: [results, new_cursor]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncBatchResult'
        new_cursor:
          type: integer
    RevisionConflictResponse:
      type: object
      required: [code, message, retryable, record_id, expected_revision, server_revision, server_change_seq, server_schema_version, server_key_version, is_tombstone]
      properties:
        code:
          const: "REVISION_CONFLICT"
        message:
          type: string
        retryable:
          type: boolean
        record_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
        server_revision:
          type: integer
        server_change_seq:
          type: integer
        server_schema_version:
          type: integer
        server_key_version:
          type: integer
        is_tombstone:
          type: boolean
        server_ciphertext:
          type: [string, "null"]
        server_nonce_b64u:
          type: [string, "null"]
    PairingExchangeRequest:
      type: object
      required: [vault_id, ticket, device_id, device_public_key]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        ticket:
          type: string
          description: Raw 256-bit pairing secret (server hashes and compares)
        device_id:
          type: string
          format: uuid
        device_public_key:
          type: string
        label:
          type: string
    PairingExchangeResponse:
      type: object
      required: [vault_id, device_id, device_token, created_at]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        device_id:
          type: string
          format: uuid
        device_token:
          type: string
          description: Raw token returned once; server stores only hash
        created_at:
          type: string
          format: date-time
    CryptoMetadataUpdateRequest:
      type: object
      required: [expected_crypto_format_version, expected_key_version, master_envelope]
      properties:
        expected_crypto_format_version:
          type: integer
        expected_key_version:
          type: integer
        master_envelope:
          $ref: '#/components/schemas/MasterEnvelope'
        recovery_envelope:
          type: [object, "null"]
        recovery_auth_verifier:
          type: [string, "null"]
    RecoveryEnrollRequest:
      type: object
      required: [vault_id, recovery_auth_token, device_id, device_public_key]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        recovery_auth_token:
          type: string
          description: HKDF(recovery_secret, PV-V1/RECOVERY-AUTH), raw secret never sent
        device_id:
          type: string
          format: uuid
        device_public_key:
          type: string
        label:
          type: string
    RecoveryEnrollResponse:
      type: object
      required: [vault_id, device_id, device_token, recovery_envelope, created_at]
      properties:
        vault_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        device_id:
          type: string
          format: uuid
        device_token:
          type: string
        recovery_envelope:
          $ref: '#/components/schemas/RecoveryEnvelope'
        created_at:
          type: string
          format: date-time
  responses:
    ValidationError:
      description: 400 VALIDATION_ERROR / CRYPTO_VERSION_UNSUPPORTED / TICKET_INVALID / SYNC_CURSOR_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TicketInvalid:
      description: 400 TICKET_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SyncCursorInvalid:
      description: 400 SYNC_CURSOR_INVALID — client resets cursor to 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 401 DEVICE_UNAUTHORIZED / DEVICE_REVOKED / INVALID_SIGNATURE / STALE_TIMESTAMP
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedSigned:
      description: 401 signed-endpoint auth failure (token + PV-Device signature required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 VAULT_NOT_FOUND (uniform, avoids enumeration oracle)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 409 REPLAY_DETECTED / REVISION_CONFLICT / VERSION_MISMATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RevisionConflict:
      description: 409 REVISION_CONFLICT with server record state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflictResponse'
    VersionMismatch:
      description: 409 VERSION_MISMATCH — UI shows please-update-app
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Gone:
      description: 410 TICKET_EXPIRED / TICKET_CONSUMED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: 413 PAYLOAD_TOO_LARGE — record >384 KiB, batch >50, body >1 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 429 RATE_LIMITED with Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Server-Time:
          $ref: '#/components/headers/X-Server-Time'
      content:
        application/json:
