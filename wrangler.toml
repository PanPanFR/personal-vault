# Personal Vault deployment configuration (Cloudflare Pages + D1).
#
# The whole setup: one Pages project, one D1 database, one secret.
#
#   1. npx wrangler d1 create personal-vault
#      → paste the returned database_id below
#   2. npx wrangler d1 migrations apply personal-vault --remote   (first deploy)
#      npx wrangler d1 migrations apply personal-vault --local    (dev)
#   3. npx wrangler pages secret put PV_PASSWORD --project-name personal-vault
#   4. pnpm deploy
#
# There is exactly one secret: PV_PASSWORD — the single vault password.
# Items are stored plaintext in D1; do not put secrets you cannot afford to
# expose in a database breach.

name = "personal-vault"
compatibility_date = "2025-02-01"
pages_build_output_dir = "dist"

# Binding used by functions/_shared/auth.ts (`env.DB`).
[[d1_databases]]
binding = "DB"
database_name = "personal-vault"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"
